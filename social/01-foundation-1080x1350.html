<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foundation Membership 1080x1350</title>
<link rel="stylesheet" href="brand.css">
<style>
    .inner { padding: 92px 86px 86px; }
    .head-gap { height: 78px; }
    .eyebrow { font-size: 24px; }
    .t-serif { font-size: 104px; margin-top: 34px; }
    .t-block { font-size: 158px; margin-top: 4px; }
    .price-band {
        display: flex; align-items: flex-end; gap: 34px;
        margin-top: 54px; padding-bottom: 40px;
    }
    .price { font-size: 210px; }
    .price-term {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 44px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.14em; color: rgba(234,241,246,0.85);
        padding-bottom: 26px; white-space: nowrap;
    }
    .hits { display: flex; flex-direction: column; gap: 0; margin-top: 8px; }
    .hit {
        display: flex; align-items: center; gap: 24px;
        padding: 26px 0; border-top: 2px solid rgba(234,241,246,0.18);
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 46px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.04em; color: var(--white); line-height: 1.1;
    }
    .hit:last-child { border-bottom: 2px solid rgba(234,241,246,0.18); }
    .hit b { color: #8FD3F0; font-weight: 800; }
</style>
</head>
<body>
<div class="canvas port">
    <div class="photo"></div>
    <div class="veil-soft"></div>

    <div class="inner">
        <img class="logo" src="assets/logo.png" alt="Padel Logan">
        <div class="head-gap"></div>

        <span class="eyebrow">Foundation Membership</span>
        <div class="serif t-serif">Foundation</div>
        <div class="block outline t-block">MEMBERSHIP</div>

        <div class="price-band">
            <div class="price"><sup>$</sup>1,499</div>
            <div class="price-term">for 12<br>months</div>
        </div>

        <div class="hits">
            <div class="hit"><b>Free</b> non-peak court play</div>
            <div class="hit"><b>$10</b> per hour at peak</div>
            <div class="hit"><b>2 weeks</b> advance booking</div>
        </div>

        <div class="cta-foot">
            <div class="cta-line">Foundation memberships are limited. Email us to secure yours.</div>
            <div class="cta-mail">
                <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><polyline points="3,6.5 12,13 21,6.5"/></svg>
                info@padellogan.com.au
            </div>
            <div class="foot-brand">
                <img class="logo logo-sm" src="assets/logo.png" alt="Padel Logan">
                <div class="foot-note">Opening 2026<br>Meadowbrook QLD</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
