<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure your membership 1080x1080</title>
<link rel="stylesheet" href="brand.css">
<style>
    .inner { padding: 84px 84px 74px; align-items: center; text-align: center; }
    .top-logo { margin: 0 auto; }
    .eyebrow { margin: 0 auto; margin-top: 44px; font-size: 23px; }
    .t-serif { font-size: 82px; margin-top: 34px; }
    .t-block { font-size: 104px; margin-top: 2px; color: var(--white); }
    .lead {
        font-size: 27px; line-height: 1.6; color: rgba(234,241,246,0.82);
        max-width: 20ch; margin: 32px auto 0;
    }
    .mail-box {
        margin-top: 46px; border: 2px solid var(--white); padding: 34px 46px;
        display: inline-flex; align-items: center; gap: 20px;
        font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
        font-size: 52px; color: var(--white); letter-spacing: 0.01em;
    }
    .mail-box svg { width: 46px; height: 46px; flex-shrink: 0; }
    .mail-box svg rect, .mail-box svg polyline {
        fill: none; stroke: var(--white); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .price-line {
        margin-top: 40px;
        font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; color: rgba(234,241,246,0.85);
    }
    .price-line b { color: var(--white); font-weight: 900; font-size: 48px; }
    .foot-note-c {
        margin-top: auto; padding-top: 40px;
        font-size: 21px; letter-spacing: 0.2em; text-transform: uppercase;
        color: rgba(234,241,246,0.6);
    }
</style>
</head>
<body>
<div class="canvas sq">
    <div class="photo"></div>
    <div class="veil"></div>

    <div class="inner">
        <img class="logo top-logo" src="assets/logo.png" alt="Padel Logan">

        <span class="eyebrow">Foundation Memberships Open</span>
        <div class="serif t-serif">Secure your</div>
        <div class="block t-block">MEMBERSHIP</div>

        <p class="lead">Foundation Memberships are limited and allocated in order of enquiry.</p>

        <div class="mail-box">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><polyline points="3,6.5 12,13 21,6.5"/></svg>
            info@padellogan.com.au
        </div>

        <div class="price-line"><b>$1,499</b> for 12 months</div>

        <div class="foot-note-c">Opening 2026 · Meadowbrook QLD</div>
    </div>
</div>
</body>
</html>
