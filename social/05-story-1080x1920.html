<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foundation Membership story 1080x1920</title>
<link rel="stylesheet" href="brand.css">
<style>
    /* Story safe area: keep content between ~250px top and ~320px bottom */
    .inner { padding: 260px 92px 300px; }
    .eyebrow { font-size: 26px; }
    .t-serif { font-size: 108px; margin-top: 40px; line-height: 1.18; }
    .t-block { font-size: 152px; margin-top: 4px; }
    .price { font-size: 250px; margin-top: 64px; }
    .price-term {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 50px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.16em; color: rgba(234,241,246,0.9); margin-top: 18px;
    }
    .hits { margin-top: 66px; }
    .hit {
        display: flex; align-items: center; gap: 26px;
        padding: 30px 0; border-top: 2px solid rgba(234,241,246,0.18);
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 50px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.04em; color: var(--white);
    }
    .hit:last-child { border-bottom: 2px solid rgba(234,241,246,0.18); }
    .hit b { color: #8FD3F0; font-weight: 800; }
    .cta-mail { font-size: 50px; }
    .cta-line { font-size: 28px; }
    .top-logo { position: absolute; top: 130px; left: 92px; z-index: 4; }
</style>
</head>
<body>
<div class="canvas story">
    <div class="photo"></div>
    <div class="veil"></div>

    <img class="logo top-logo" src="assets/logo.png" alt="Padel Logan">

    <div class="inner">
        <span class="eyebrow">Foundation Membership</span>
        <div class="serif t-serif">Founding</div>
        <div class="block outline t-block">MEMBERS</div>

        <div class="price"><sup>$</sup>1,499</div>
        <div class="price-term">for 12 months</div>

        <div class="hits">
            <div class="hit"><b>Free</b> non-peak play</div>
            <div class="hit"><b>$10</b> peak play</div>
            <div class="hit"><b>Launch party</b> + lesson + gift pack</div>
        </div>

        <div class="cta-foot">
            <div class="cta-line">Limited spots. Email to secure yours.</div>
            <div class="cta-mail">
                <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><polyline points="3,6.5 12,13 21,6.5"/></svg>
                info@padellogan.com.au
            </div>
        </div>
    </div>
</div>
</body>
</html>
